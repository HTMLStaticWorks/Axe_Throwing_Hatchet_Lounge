<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register | Ironwood Hatchet Lounge</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .auth-split {
            min-height: 100vh;
        }
        .auth-photo {
            background: linear-gradient(rgba(26, 26, 26, 0.4), rgba(26, 26, 26, 0.8)), 
                        url('https://images.unsplash.com/photo-1599058917233-5574bc362031?auto=format&fit=crop&q=80&w=1200');
            background-size: cover;
            background-position: center;
        }
        .auth-form-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            background: var(--bg-body);
        }
        .nav-pills-auth .nav-link {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: var(--accent-color);
            border-radius: 0;
            padding: 1rem 2rem;
            transition: var(--transition-smooth);
        }
        .nav-pills-auth .nav-link.active {
            background: var(--highlight-color);
            color: white;
        }
    </style>
</head>
<body>

    <div class="container-fluid p-0 auth-split">
        <div class="row g-0 h-100">
            <!-- Photo Side -->
            <div class="col-lg-6 d-none d-lg-block auth-photo position-relative">
                <div class="position-absolute bottom-0 left-0 p-5 text-white">
                    <a class="navbar-brand d-flex align-items-center mb-4" href="index.html">
                        <i data-lucide="axe" class="me-2 text-highlight"></i>
                        <span class="h2 mb-0 text-white display-font">IRONWOOD <span class="text-highlight">HATCHET</span></span>
                    </a>
                    <h1 class="display-3 mb-3">Join The <span class="text-highlight">Community</span></h1>
                    <p class="lead opacity-75">Track your scores, manage bookings, and stay updated on league standings.</p>
                </div>
            </div>

            <!-- Form Side -->
            <div class="col-lg-6 auth-form-container">
                <div class="w-100" style="max-width: 450px;" data-aos="fade-left">
                    <div class="text-center mb-5 d-lg-none">
                        <a class="navbar-brand d-flex align-items-center justify-content-center mb-4" href="index.html">
                            <i data-lucide="axe" class="me-2 text-highlight"></i>
                            <span class="h3 mb-0 text-white display-font">IRONWOOD <span class="text-highlight">HATCHET</span></span>
                        </a>
                    </div>
                    
                    <ul class="nav nav-pills nav-pills-auth mb-4 justify-content-center" id="authTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login" type="button" role="tab">Login</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register" type="button" role="tab">Register</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="authTabContent">
                        <!-- Login Form -->
                        <div class="tab-pane fade show active" id="login" role="tabpanel">
                            <form>
                                <div class="mb-3">
                                    <label class="form-label small">Email Address</label>
                                    <input type="email" class="form-control bg-dark border-secondary text-white py-3" placeholder="name@example.com" required>
                                </div>
                                <div class="mb-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <label class="form-label small mb-0">Password</label>
                                        <a href="#" class="small text-highlight text-decoration-none">Forgot Password?</a>
                                    </div>
                                    <input type="password" class="form-control bg-dark border-secondary text-white py-3" placeholder="••••••••" required>
                                </div>
                                <div class="mb-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="remember">
                                        <label class="form-check-label small text-muted" for="remember">Remember me for 30 days</label>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-3 mb-4">Sign In</button>
                                
                                <div class="text-center position-relative mb-4">
                                    <hr class="border-secondary opacity-25">
                                    <span class="position-absolute top-50 start-50 translate-middle bg-body px-3 small text-muted">Or continue with</span>
                                </div>
                                
                                <div class="row g-2">
                                    <div class="col-6">
                                        <button type="button" class="btn btn-outline-secondary w-100 py-2 d-flex align-items-center justify-content-center">
                                            <i data-lucide="chrome" class="me-2" style="width: 18px;"></i> Google
                                        </button>
                                    </div>
                                    <div class="col-6">
                                        <button type="button" class="btn btn-outline-secondary w-100 py-2 d-flex align-items-center justify-content-center">
                                            <i data-lucide="facebook" class="me-2" style="width: 18px;"></i> Facebook
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>

                        <!-- Register Form -->
                        <div class="tab-pane fade" id="register" role="tabpanel">
                            <form>
                                <div class="mb-3">
                                    <label class="form-label small">Full Name</label>
                                    <input type="text" class="form-control bg-dark border-secondary text-white py-3" placeholder="John Doe" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small">Email Address</label>
                                    <input type="email" class="form-control bg-dark border-secondary text-white py-3" placeholder="name@example.com" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small">Phone Number</label>
                                    <input type="tel" class="form-control bg-dark border-secondary text-white py-3" placeholder="(512) 555-0000">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small">Occasion Preference (Optional)</label>
                                    <select class="form-select bg-dark border-secondary text-white py-3">
                                        <option selected>Select Preference</option>
                                        <option>League Player</option>
                                        <option>Casual Thrower</option>
                                        <option>Event Organizer</option>
                                        <option>Corporate Booker</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small">Password</label>
                                    <input type="password" class="form-control bg-dark border-secondary text-white py-3" placeholder="••••••••" required>
                                </div>
                                <div class="mb-4">
                                    <p class="small text-muted mb-0">By registering, you agree to our <a href="#" class="text-highlight">Terms of Service</a> and <a href="#" class="text-highlight">Privacy Policy</a>.</p>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-3">Create Account</button>
                            </form>
                        </div>
                    </div>
                    
                    <div class="text-center mt-5">
                        <a href="index.html" class="text-accent text-decoration-none small"><i data-lucide="arrow-left" class="me-2" style="width: 14px;"></i> Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
