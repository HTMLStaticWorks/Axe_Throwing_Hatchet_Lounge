<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AxeHaus</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg-body);
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-body);
            transition: var(--transition-smooth);
            margin-bottom: 0.5rem;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .social-btn:hover {
            background: rgba(234, 88, 12, 0.05);
            border-color: var(--highlight-color);
            color: var(--highlight-color);
        }

        .hover-underline:hover {
            text-decoration: underline !important;
        }
    </style>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' class='lucide lucide-axe'><path d='m14 12-8.5 8.5a2.12 2.12 0 1 1-3-3L11 9'/><path d='M15 13 9 7l4-4 6 6h3a8 8 0 0 1-7 7z'/></svg>">
</head>

<body>

    <div class="auth-wrapper">
        <div class="theme-controls-fixed">
            <button id="theme-toggle" class="btn btn-link p-0 text-white">
                <i data-lucide="sun"></i>
            </button>
            <button id="rtl-toggle" class="btn btn-link p-0 text-white">
                <i data-lucide="arrow-left-right"></i>
            </button>
        </div>

        <div class="auth-card" data-aos="fade-up">
            <div class="text-center mb-4">
                <a class="navbar-brand d-flex align-items-center justify-content-center mb-3" href="index.html">
                    <i data-lucide="axe" class="me-2 text-highlight"></i>
                    <span class="h3 mb-0 display-font">Axehus</span>
                </a>
                <h2 class="h4">Welcome Back</h2>
                <p class="small text-muted">Please enter your details to sign in.</p>
            </div>

            <form>
                <div class="mb-3">
                    <label class="form-label small">Email Address</label>
                    <input type="email" class="form-control bg-dark border-secondary text-white py-2" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Password</label>
                    <div class="input-group input-group-auth">
                        <input type="password" class="form-control bg-dark border-secondary text-white py-2" required
                            id="password-input">
                        <button class="btn btn-outline-secondary border-secondary" type="button"
                            onclick="togglePassword('password-input')">
                            <i data-lucide="eye" style="width: 18px;"></i>
                        </button>
                    </div>
                </div>
                <div
                    class="mb-4 d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label small text-muted" for="remember">Remember Me</label>
                    </div>
                    <a href="#" class="small text-highlight text-decoration-none hover-underline">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mb-4">Sign In</button>

                <div class="d-flex align-items-center mb-4">
                    <div class="flex-grow-1 border-bottom border-secondary opacity-25"></div>
                    <span class="px-3 small text-muted">Or continue with</span>
                    <div class="flex-grow-1 border-bottom border-secondary opacity-25"></div>
                </div>

                <div class="d-flex flex-column gap-2 mb-4">
                    <a href="#" class="social-btn">
                        <i data-lucide="mail" class="me-2" style="width: 16px;"></i> Google
                    </a>
                    <a href="#" class="social-btn">
                        <i class="fab fa-facebook-f me-2" style="width: 16px;"></i> Facebook
                    </a>
                    <a href="#" class="social-btn">
                        <i class="fab fa-apple me-2" style="width: 16px;"></i> Apple
                    </a>
                </div>

                <div class="text-center">
                    <p class="small text-muted mb-0 text-nowrap">Don't have an account? <a href="register.html"
                            class="text-highlight fw-bold text-decoration-none hover-underline">Signup</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        lucide.createIcons();

        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = input.nextElementSibling.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
    </script>
</body>

</html>
