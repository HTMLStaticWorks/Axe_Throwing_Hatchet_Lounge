<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | AxeHaus</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .coming-soon-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: var(--primary-color);
        }

        .countdown-item {
            min-width: 100px;
            padding: 1.5rem;
            background: rgba(234, 88, 12, 0.1);
            border: 1px solid rgba(234, 88, 12, 0.2);
        }

        .countdown-value {
            font-size: 2.5rem;
            display: block;
            line-height: 1;
        }

        .countdown-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
        }
    </style>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' class='lucide lucide-axe'><path d='m14 12-8.5 8.5a2.12 2.12 0 1 1-3-3L11 9'/><path d='M15 13 9 7l4-4 6 6h3a8 8 0 0 1-7 7z'/></svg>">
</head>

<body>

    <div class="coming-soon-container wood-grain overflow-hidden position-relative">
        <div class="hero-overlay opacity-80"></div>
        <div class="ember-container"></div>

        <div class="position-relative z-3 w-100" style="max-width: 800px;">
            <div class="mb-5" data-aos="zoom-in">
                <i data-lucide="axe" class="text-highlight axe-spin mb-4" style="width: 80px; height: 80px;"></i>
                <h1 class="display-1 text-white mb-2">SOMETHING <span class="text-highlight">SHARP</span> IS COMING.
                </h1>
                <p class="h4 text-accent text-uppercase letter-spacing-1 mb-5">New Season Launching Soon</p>
            </div>

            <!-- Countdown -->
            <div class="d-flex flex-wrap justify-content-center gap-3 mb-5" data-aos="fade-up" data-aos-delay="100">
                <div class="countdown-item">
                    <span class="countdown-value display-font text-white" id="days">30</span>
                    <span class="countdown-label">Days</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-value display-font text-white" id="hours">24</span>
                    <span class="countdown-label">Hours</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-value display-font text-white" id="minutes">00</span>
                    <span class="countdown-label">Mins</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-value display-font text-white" id="seconds">00</span>
                    <span class="countdown-label">Secs</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="mb-5" data-aos="fade-up" data-aos-delay="200">
                <div class="d-flex justify-content-between mb-2 small text-accent">
                    <span>Lanes prepped & ready</span>
                    <span>97%</span>
                </div>
                <div class="progress rounded-0 bg-dark border border-secondary" style="height: 10px;">
                    <div class="progress-bar bg-highlight" role="progressbar" style="width: 97%;"></div>
                </div>
            </div>

            <!-- Newsletter -->
            <div class="card bg-dark border-secondary p-4 p-md-5 mb-5" data-aos="fade-up" data-aos-delay="300">
                <h4 class="text-white mb-3">Get Early Access</h4>
                <p class="small text-muted mb-4">Sign up for early league registration + 20% off your first lane booking
                    when we launch.</p>
                <form class="input-group mb-3">
                    <input type="email" class="form-control bg-dark border-secondary text-white py-3"
                        placeholder="Enter your email address">
                    <button class="btn btn-primary px-4" type="submit">Notify Me</button>
                </form>
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <a href="#" class="social-icon-link"><i class="fab fa-instagram"></i></a>
                    <a href="#" class="social-icon-link"><i class="fab fa-facebook"></i></a>
                    <a href="#" class="social-icon-link"><i class="fab fa-twitter"></i></a>
                </div>
            </div>

            <a href="index.html" class="text-accent text-decoration-none small" data-aos="fade-up" data-aos-delay="400">
                <i data-lucide="arrow-left" class="me-2" style="width: 14px;"></i> Return to Homepage
            </a>
        </div>
    </div>


    <!-- Scroll Top Button -->
    <button id="scroll-top" class="btn btn-primary rounded-circle position-fixed bottom-0 end-0 m-4 d-none"
        style="z-index: 1000; width: 50px; height: 50px; padding: 0;">
        <i data-lucide="arrow-up"></i>
    </button>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        lucide.createIcons();

        // Simple Countdown Timer
        const launchDate = new Date(new Date().getTime() + 30 * 24 * 60 * 60 * 1000).getTime();

        const x = setInterval(function () {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours;
            document.getElementById("minutes").innerHTML = minutes;
            document.getElementById("seconds").innerHTML = seconds;

            if (distance < 0) {
                clearInterval(x);
                document.getElementById("days").innerHTML = "0";
                document.getElementById("hours").innerHTML = "0";
                document.getElementById("minutes").innerHTML = "0";
                document.getElementById("seconds").innerHTML = "0";
            }
        }, 1000);
    </script>
</body>

</html>
